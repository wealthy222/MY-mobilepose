GPUS: '0'
DATA_DIR: ''
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 0    #原8
PRINT_FREQ: 100
EXP_NAME: 'demo'
CUDNN:
  BENCHMARK: True
  DETERMINISTIC: False
  ENABLED: True
DATASET:
  DATASET: h36m
  ROOT: 'G:/human3.6'
  TEST_SET: valid
  TRAIN_SET: train
  FLIP: false
  TRI: true
  MPII_ORDER: false
  OCCLUSION: false #遮挡关闭
  BG_AUG: false
  NUM_CAMS: 4
  #VOC: 'data/VOC2012' # If you want to use synthetic occlusion, please enter the VOC path
MODEL:
  NAME: MobileNetV3_Large
  PRETRAINED: 'models/imagenet/resnet50-11ad3fa6.pth'            #'models/mpii_integral/model_best.pth.tar'
  RESUME: ''
  NUM_JOINTS: 17
  VOLUME: true
  EXTRA:
    FINAL_CONV_KERNEL: 1
    DECONV_WITH_BIAS: false
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS:
    - 256
    - 256
    - 256
    NUM_DECONV_KERNELS:
    - 4
    - 4
    - 4
    MobileNetV3_Large:
      WIDTH_MULT: 1.0
      USE_SE: true
LOSS:
  FN: SmoothL1JointLocationLoss
TRAIN:
  BATCH_SIZE: 2   #原来32
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 50  #原来140
  RESUME: false
  OPTIMIZER: adamw
  LR: 0.00025     #原来0.001
  LR_FACTOR: 0.1
  LR_STEP:
  - 30        #原来90 120
  - 40
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE: 2   #原来32
  FLIP_TEST: false
  MODEL_FILE: ''
DEBUG:
  DEBUG: false